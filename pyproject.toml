[project]
name = "carnet-lecture"
version = "0.1.0"
description = "API REST pour suivre mes lectures"
authors = [
    {name = "Anaïs Dubois",email = "147182467+anaisd5@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlmodel (>=0.0.47,<0.0.48)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]

[tool.poetry]
package-mode = false
